services:
  postgres:
    image: postgres:16-alpine
    container_name: my-case-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: mycase
      POSTGRES_PASSWORD: mycase_dev_password
      POSTGRES_DB: mycase_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mycase -d mycase_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
