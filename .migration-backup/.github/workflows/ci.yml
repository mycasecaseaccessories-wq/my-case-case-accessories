name: B00 foundation checks

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Ruff check
        run: ruff check .
      - name: MyPy check
        run: mypy app
      - name: Pytest
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [website, admin, pos]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false
      - name: Type check
        run: pnpm typecheck
      - name: Build
        run: pnpm build

  e2e-foundation:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Note
        run: echo "E2E server orchestration is deferred to the implementation pipeline batch; no production deploy is configured."
