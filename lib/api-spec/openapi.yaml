openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: My Case commerce API
servers:
  - url: /api/v1
    description: Versioned commerce API
tags:
  - name: health
  - name: catalog
  - name: inventory
  - name: customers
  - name: orders
  - name: auth
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /catalog/categories:
    get:
      operationId: listCategories
      tags: [catalog]
      summary: List active catalog categories
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      operationId: createCategory
      tags: [catalog]
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
  /catalog/products:
    get:
      operationId: listProducts
      tags: [catalog]
      summary: List active products
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [catalog]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
  /catalog/products/{productId}:
    patch:
      operationId: updateProduct
      tags: [catalog]
      summary: Update product status
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
  /catalog/products/manage:
    get:
      operationId: listManagedProducts
      tags: [catalog]
      summary: List active and inactive products for administrators
      responses:
        "200":
          description: All products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
  /inventory:
    get:
      operationId: listInventory
      tags: [inventory]
      summary: List inventory
      responses:
        "200":
          description: Inventory items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Inventory"
  /inventory/{productId}/adjust:
    post:
      operationId: adjustInventory
      tags: [inventory]
      summary: Adjust product inventory
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryAdjustment"
      responses:
        "200":
          description: Updated inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inventory"
  /customers:
    post:
      operationId: createCustomer
      tags: [customers]
      summary: Create or register a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "201":
          description: Customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
  /customers/lookup:
    get:
      operationId: lookupCustomer
      tags: [customers]
      summary: Find a customer by phone
      parameters:
        - name: phone
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Matching customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomerLookupResult"
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List recent orders
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in an admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthToken"
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "201":
          description: Created account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
  /auth/bootstrap-admin:
    post:
      operationId: bootstrapAdmin
      tags: [auth]
      summary: Provision the one-time initial administrator with a setup secret
      parameters:
        - name: X-Admin-Setup-Secret
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "201":
          description: Provisioned administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the current authenticated account
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
  /auth/telegram/verify:
    post:
      operationId: verifyTelegram
      tags: [auth]
      summary: Verify Telegram WebApp init data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramInitData"
      responses:
        "200":
          description: Verified Telegram identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramVerification"
  /telegram/link:
    post:
      operationId: linkTelegramCustomer
      tags: [customers]
      summary: Link the verified Telegram identity to a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramLinkInput"
      responses:
        "200":
          description: Linked customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramLink"
  /telegram/cart:
    get:
      operationId: getTelegramCart
      tags: [orders]
      summary: Get the verified customer's persistent cart
      responses:
        "200":
          description: Customer cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramCart"
  /telegram/cart/items:
    post:
      operationId: upsertTelegramCartItem
      tags: [orders]
      summary: Add or replace a persistent cart line
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramCartItemInput"
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramCart"
  /telegram/cart/items/{productId}:
    delete:
      operationId: deleteTelegramCartItem
      tags: [orders]
      summary: Remove a persistent cart line
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramCart"
  /telegram/cart/checkout:
    post:
      operationId: checkoutTelegramCart
      tags: [orders]
      summary: Checkout the verified customer's persistent cart
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramOrder"
  /telegram/orders:
    get:
      operationId: listTelegramOrders
      tags: [orders]
      summary: List orders belonging to the verified customer
      responses:
        "200":
          description: Customer orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TelegramOrder"
  /telegram/orders/{orderId}:
    get:
      operationId: getTelegramOrder
      tags: [orders]
      summary: Get one order belonging to the verified customer
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Customer order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramOrder"
components:
  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
    Category:
      type: object
      required: [id, name, slug, is_active]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        description: { type: ["string", "null"] }
        is_active: { type: boolean }
    CategoryInput:
      type: object
      required: [name, slug]
      properties:
        name: { type: string, minLength: 1 }
        slug: { type: string, minLength: 1 }
    Product:
      type: object
      required: [id, category_id, name, slug, sku, price, is_active]
      properties:
        id: { type: string }
        category_id: { type: string }
        name: { type: string }
        slug: { type: string }
        sku: { type: string }
        description: { type: ["string", "null"] }
        price: { type: string }
        is_active: { type: boolean }
    ProductInput:
      type: object
      required: [category_id, name, slug, sku, price]
      properties:
        category_id: { type: string }
        name: { type: string }
        slug: { type: string }
        sku: { type: string }
        price: { type: string }
        description: { type: string }
    ProductUpdate:
      type: object
      required: [is_active]
      properties:
        is_active: { type: boolean }
    Inventory:
      type: object
      required: [product_id, quantity, reorder_level, low_stock]
      properties:
        product_id: { type: string }
        quantity: { type: number }
        reorder_level: { type: number }
        low_stock: { type: boolean }
    InventoryAdjustment:
      type: object
      required: [delta, reason]
      properties:
        delta: { type: number }
        reason: { type: string }
    Customer:
      type: object
      required: [id, full_name, phone]
      properties:
        id: { type: string }
        full_name: { type: string }
        phone: { type: string }
    CustomerLookupResult:
      type: object
      required: [id]
      properties:
        id: { type: string }
    CustomerInput:
      type: object
      required: [full_name, phone]
      properties:
        full_name: { type: string }
        phone: { type: string }
    OrderItemInput:
      type: object
      required: [product_id, quantity]
      properties:
        product_id: { type: string }
        quantity: { type: number, minimum: 1 }
    OrderInput:
      type: object
      required: [customer_id, customer_name, customer_phone, items]
      properties:
        customer_id: { type: string }
        customer_name: { type: string }
        customer_phone: { type: string }
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItemInput"
    Order:
      type: object
      required: [id, status, total, customer_name, customer_phone]
      properties:
        id: { type: string }
        status: { type: string }
        total: { type: string }
        customer_name: { type: string }
        customer_phone: { type: string }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string, minLength: 8 }
    AuthToken:
      type: object
      required: [access_token, user]
      properties:
        access_token: { type: string }
        user:
          type: object
          required: [role]
          properties:
            role: { type: string }
    Account:
      type: object
      required: [id, email, role]
      properties:
        id: { type: string }
        email: { type: string }
        role: { type: string }
    TelegramInitData:
      type: object
      required: [init_data]
      properties:
        init_data: { type: string, minLength: 1, maxLength: 4096 }
    TelegramVerification:
      type: object
      required: [verified, telegram_user_id]
      properties:
        verified: { type: boolean }
        telegram_user_id: { type: string }
        username: { type: ["string", "null"] }
    TelegramLinkInput:
      type: object
      required: [full_name, phone]
      properties:
        full_name: { type: string, minLength: 1, maxLength: 160 }
        phone: { type: string, minLength: 5, maxLength: 40 }
        email: { type: ["string", "null"], maxLength: 255 }
    TelegramLink:
      type: object
      required: [linked, customer_id]
      properties:
        linked: { type: boolean }
        customer_id: { type: string }
    TelegramCartItemInput:
      type: object
      required: [product_id, quantity]
      properties:
        product_id: { type: string }
        quantity: { type: number, minimum: 1, maximum: 999 }
    TelegramCartItem:
      type: object
      required: [product_id, product_name, sku, quantity, unit_price, line_total]
      properties:
        product_id: { type: string }
        product_name: { type: string }
        sku: { type: string }
        quantity: { type: number }
        unit_price: { type: string }
        line_total: { type: string }
    TelegramCart:
      type: object
      required: [customer_id, items, total]
      properties:
        customer_id: { type: string }
        items:
          type: array
          items:
            $ref: "#/components/schemas/TelegramCartItem"
        total: { type: string }
    TelegramOrderItem:
      type: object
      required: [product_id, product_name, sku, quantity, unit_price]
      properties:
        product_id: { type: string }
        product_name: { type: string }
        sku: { type: string }
        quantity: { type: number }
        unit_price: { type: string }
    TelegramOrder:
      type: object
      required: [id, status, total, created_at, items]
      properties:
        id: { type: string }
        status: { type: string }
        total: { type: string }
        created_at: { type: string, format: date-time }
        items:
          type: array
          items:
            $ref: "#/components/schemas/TelegramOrderItem"